# Production application host. Terminate HTTPS in a trusted reverse proxy in
# front of 127.0.0.1:8080. Piston MUST run on a separate isolated execution host;
# do not add privileged executors to this application host.
name: logithm
services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-logithm-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set a random MongoDB root password}
      MONGO_INITDB_DATABASE: logithm
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set a separate random MongoDB app password (URI-safe hex recommended)}
    volumes:
      - mongodb_data:/data/db
      - ./deployments/mongodb-init.js:/docker-entrypoint-initdb.d/01-logithm.js:ro
    networks:
      - database
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand({ping: 1}).ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    mem_limit: 1g
    cpus: 1.0

  backend:
    build:
      context: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://logithm:${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD}@mongodb:27017/logithm?authSource=logithm
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set a random access-token secret of at least 32 bytes}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set a different random refresh-token secret of at least 32 bytes}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set the exact HTTPS frontend origin}
      PISTON_URL: ${PISTON_URL:?Set the private URL of the isolated execution host}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLIC_KEY: ${SUPABASE_PUBLIC_KEY:-}
      SUPABASE_PRIVATE_KEY: ${SUPABASE_PRIVATE_KEY:-}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - application
      - database
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    mem_limit: 768m
    cpus: 1.0

  frontend:
    build:
      context: ../logithm-frontend
    restart: unless-stopped
    init: true
    ports:
      - '${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - application
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5

networks:
  application:
  database:
    internal: true

volumes:
  mongodb_data:
