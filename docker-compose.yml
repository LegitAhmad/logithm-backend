services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: logithm
      POSTGRES_PASSWORD: logithm_dev
      POSTGRES_DB: logithm
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@logithm.com
      PGADMIN_DEFAULT_PASSWORD: dev
    ports:
      - '5050:80'
    depends_on:
      - postgres
    restart: unless-stopped

  piston:
    image: ghcr.io/engineer-man/piston
    privileged: true
    ports:
      - '2000:2000'
    volumes:
      - piston_data:/piston
    restart: always

volumes:
  postgres_data:
  redis_data:
  piston_data: